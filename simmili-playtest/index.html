<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Simmili Playtest Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a numbered menu of prototypes; a prototype opens as one table (office over four stacks) beside a side
   panel (hand, shop, punch, rating); stacked on a portrait phone. Colours and numbers only. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --line: #cfd4dc; --fg: #1b1f27; --dim: #687080; --accent: #1d6fe0; --ok: #1f8a4c; --bad: #c8362e;
  --office: #2a2f3a; --office-fg: #f2f4f8; --stripe: #555c6b;
  --r: #d7322e; --bl: #2459d1; --y: #f0bf1f; --p: #7b3fb8; --o: #ee7a1c; --g: #2c9a4a; --n: #7a5335; --beige: #d9c7a2; --grey: #9aa1ad; --w: #f4f4f0;
  --display: "Space Grotesk", system-ui, sans-serif; --num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ch: clamp(20px, 5.4vh, 34px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1b2029; --line: #313846; --fg: #e8ebf1; --dim: #8b93a3; --accent: #5b9bff; --ok: #3cc073; --bad: #ff6a5f;
  --office: #3a4150; --office-fg: #f2f4f8; --stripe: #59606f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b2029; --line: #313846; --fg: #e8ebf1; --dim: #8b93a3; --accent: #5b9bff; --ok: #3cc073; --bad: #ff6a5f;
  --office: #3a4150; --office-fg: #f2f4f8; --stripe: #59606f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--display); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; font-variant-numeric: tabular-nums }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0 }
.dim { color: var(--dim) }
.num { font-family: var(--num) }
/* menu */
.menu { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px }
.menu h1 { font-size: 20px; margin: 4px 0; text-wrap: balance }
.entry { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100% }
.entry:hover { border-color: var(--accent) }
.entry .n { font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--accent) }
.entry .t { font-weight: 700 }
.entry .l { grid-column: 2; font-size: 13px; color: var(--dim) }
.entry .r { grid-row: 1 / span 2; grid-column: 3; font-family: var(--num); font-size: 12px; text-align: right; color: var(--dim) }
.entry .r b { color: var(--ok) }
.stars { color: var(--y); letter-spacing: 1px }
/* play */
.app { display: grid; gap: 10px; max-width: 1280px; margin: 0 auto }
@media (min-aspect-ratio: 4/3) and (min-width: 620px) { .app { grid-template-columns: minmax(0, 1fr) minmax(260px, 34%); align-items: start } }
.top { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap }
.top .name { font-weight: 700 }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-family: var(--num); font-size: 13px }
.status b { font-size: 15px }
.bar { position: relative; width: 110px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent) }
.bar.met i { background: var(--ok) }
.pips { letter-spacing: 2px; color: var(--bad) }
.rule { background: var(--bad); color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 12px }
.days { display: grid; grid-template-columns: repeat(var(--days, 6), 1fr); gap: 4px; margin-top: 6px }
.day { border: 1px solid var(--line); border-radius: 4px; text-align: center; font-family: var(--num); font-size: 12px; padding: 1px 0; color: var(--dim) }
.day.now { border-color: var(--accent); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent) }
.day.done { opacity: .4 }
.day b { color: var(--bad) }
.table { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.offices { display: flex; gap: 3px; min-height: calc(var(--ch) * 1.7) }
.oc { flex: 1; min-width: 0; background: var(--office); color: var(--office-fg); border-radius: 5px; padding: 2px 4px; font-family: var(--num); font-size: 11px; line-height: 1.25; display: flex; flex-direction: column; justify-content: center; overflow: hidden }
.oc .sz { font-size: 16px; font-weight: 700 }
.oc.boss { box-shadow: inset 0 0 0 2px var(--bad) }
.oc.hidden { background: repeating-linear-gradient(135deg, var(--office), var(--office) 6px, var(--stripe) 6px, var(--stripe) 12px) }
.acts { display: flex; gap: 3px; min-height: 26px }
.acts button { flex: 1; min-width: 0; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 4px; font-size: 12px; padding: 2px 0; font-family: var(--num) }
.acts button.go { background: var(--accent); color: #fff }
.stack { display: flex; flex-direction: column-reverse; gap: 2px; min-height: calc(var(--ch) * 6 + 10px); border: 1px dashed var(--line); border-radius: 6px; padding: 2px; background: none; width: 100% }
.stack.sel { border: 2px solid var(--accent) }
.card { height: var(--ch); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-family: var(--num); font-weight: 700; font-size: calc(var(--ch) * .55); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.35); min-width: 0 }
.card small { font-size: 10px; font-weight: 500; opacity: .9 }
.card.lightc { color: #24201a; text-shadow: none }
.card.frozen { opacity: .45; outline: 2px dashed var(--bad); outline-offset: -2px }
.stack .card.front { height: calc(var(--ch) * 1.25); font-size: calc(var(--ch) * .75); box-shadow: 0 0 0 2px var(--fg) }
.foot { font-family: var(--num); font-size: 12px; text-align: center; color: var(--dim) }
.foot b { color: var(--fg); font-size: 14px }
.foot .jam { color: var(--bad) }
.feed { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; min-height: 22px; font-family: var(--num); font-size: 12px }
.chip { border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px }
.chip.good { border-color: var(--ok); color: var(--ok) }
.chip.bad { border-color: var(--bad); color: var(--bad) }
.chip.big { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.chip.friday { border-color: var(--accent); color: var(--accent) }
.msg { color: var(--bad); font-family: var(--num); font-size: 12px; min-height: 16px; margin-top: 4px }
.side { display: flex; flex-direction: column; gap: 10px }
.hand { display: flex; flex-wrap: wrap; gap: 5px }
.hand .h { width: calc(var(--ch) * 1.9); height: calc(var(--ch) * 2.3); flex-direction: column; justify-content: center; gap: 2px; border: none; font-size: calc(var(--ch) * .8) }
.hand .h.sel { outline: 3px solid var(--fg); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; font-family: var(--num); font-size: 13px }
.btn:disabled { opacity: .4; cursor: default }
.btn.punch { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 16px; font-weight: 700; padding: 8px 18px; flex: 1 }
.label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px }
.rules { font-size: 12px; line-height: 1.45; margin: 0; padding-left: 16px }
.legend { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--num); font-size: 11px; margin-top: 6px }
.legend span { display: inline-flex; align-items: center; gap: 3px }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line) }
input[type=text] { font-family: var(--num); font-size: 13px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0 }
#seed { width: 13ch }
#note { flex: 1; min-width: 12ch }
.rate button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 34px; height: 30px; font-family: var(--num); font-weight: 700 }
.rate button.on { background: var(--y); color: #24201a; border-color: var(--y) }
.over { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20 }
.over .panel { text-align: center; padding: 18px 24px; font-family: var(--num); max-width: 420px; width: 100% }
.over .big { font-size: 28px; font-weight: 700; font-family: var(--display) }
.erow { display: flex; gap: 6px; align-items: stretch }
.erow .entry { flex: 1; min-width: 0 }
.ibtn { flex: 0 0 auto; width: 34px; min-height: 34px; border: 1px solid var(--accent); color: var(--accent); background: var(--panel); border-radius: 50%; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 16px; align-self: center }
.info-over { z-index: 30 }
.over .panel.info { text-align: left; font-family: var(--display); max-width: 560px; max-height: 88vh; overflow-y: auto; font-size: 14px; line-height: 1.45 }
.info p { margin: 4px 0 10px }
.boot { max-width: 520px; margin: 40px auto; text-align: center; font-family: var(--num) }
@media (prefers-reduced-motion: no-preference) { .chip { animation: pop .25s ease-out } @keyframes pop { from { transform: scale(.8); opacity: .3 } } }
</style>

<div id="app"><div class="boot panel">starting the C# engine…</div></div>

<script id="info">
// The playtest hub's help, one card per entry: what it is, what it is testing for, what to watch, how it plays.
// Plain words for a tester who has never seen the game. Pasted into hub.html by build.sh (between the INFO markers).
const ABOUT = {
  title: 'About this playtest',
  lines: [
    'Simmili & Co. is an office card game in the making: you build a team from cards, merge them into stronger ones, and keep the office happy week after week.',
    'Each entry on the menu is one version of a rule. We change one thing at a time and ask you how it feels.',
  ],
  rate: [
    'Pick an entry, play until the run ends (or until you are bored: that is an answer too), then tap a number from 1 (dull) to 5 (great fun).',
    'Write one line about why. "I never knew what to do" helps as much as "loved it".',
    'Outside Claude, your ratings stay in this browser: press "send feedback" to post them, or "copy feedback" to paste them to us.',
  ],
  helps: [
    'When you felt excited, tense, bored or lost, and what was on the table at that moment.',
    'Anything you could not understand from the screen.',
    'Whether it felt too easy or too hard, and in which week.',
    'Your seed (shown at the top) if something odd happened, so we can replay it exactly.',
  ],
};

const WATCH = 'Was it fun? Note when you felt excited, tense, bored or confused, and whether it was too easy or too hard.';

const BU_HOW = [
  'Tap a card in your hand, then a slot. A 1 starts an empty slot. Two cards with the same number merge into one higher card. A card can also go on a stack whose top card is exactly one lower. A 1 can tuck in behind a stack.',
  'PUNCH ends the turn: each stack makes the number shown under it. That work first hits the office card above the stack, then counts toward the week\'s target (top bar).',
  'Red ✕ numbers are blame. Blame knocks down the lowest card of that stack first. Blame on an empty slot hits you, and 10 of it is a strike.',
  'Reach the week\'s target within the turns shown, or take a strike. Three strikes end the run; last 9 weeks to win.',
  'Money: packs bring new cards; a card of level 2+ costs money once when you place it; every Friday your table earns its bills and pays its salaries. You can borrow, but the debt grows 60% a week and is due at each boss week.',
];

const BU_COLOURS = 'Colours: a stack whose top card matches the colour of the cards behind it works harder. Mixing colours makes new colours with their own effects (the legend on the right).';

// [what this version is, what it is testing for, what is different from entry 1 (optional), extra thing to watch (optional)]
const INFO = {
  'bu-default': ['Build Up as it stands today: paint-mixing colours, white interns, a $500 start with a random bonus, a shop, a credit line.', 'Is building one big stack toward a rare card you cannot play yet exciting, and is the money a real decision?', '', 'Did you ever wait for a card you could not place yet? Did borrowing feel worth the risk?'],
  'bu-flush': ['Colours work like suits instead of paint: same-colour cards behind the top card add 25% each.', 'Are simple matching colours more fun than mixing paint?', 'Colours never mix: a merge of two colours turns the card grey.'],
  'bu-colour-interns': ['Interns (the 1s) carry their department\'s colour instead of white.', 'Do coloured interns make the colour game easier to read and more fun?', 'Every intern is red, blue or yellow from the start.'],
  'bu-free-removal': ['Firing a card from your deck costs nothing.', 'Does free firing make the deck too easy to tune, or more fun to shape?', 'The fire button is free.'],
  'bu-no-beige': ['No Corporate Beige cards: the brown-plus-beige x2.5 trick is gone.', 'Does the game miss its weirdest route, or is it cleaner without it?'],
  'bu-no-credit': ['No borrowing at all.', 'Does removing the credit line make the game dull or tense?', 'There is no borrow button: you can only spend what you have.'],
  'bu-risk-off': ['An older economy: random start, one flat-price pack a turn, no loans, no bonus for big weeks.', 'Was the game better before we added risk and the shop?', 'One pack a turn at a fixed price; no loans; no bonus.'],
  'bu-old-shop': ['The old shop: one flat-price pack a turn, no advanced packs.', 'Does a bigger, pricier shop beat a simple one?', 'At most one pack a turn.'],
  'bu-random-start': ['You start with random cards and no bonus instead of the same five interns.', 'Is a known start fairer and more fun than a random one?', 'Your first hand is random.'],
  'bu-keep-hand': ['No deck to draw from: you keep a hand of up to 10 cards.', 'Is drawing 5 a turn from a deck better than holding everything?', 'Cards stay in your hand until you play them; no roster.'],
  'bu-fixed-week': ['Every week lasts 5 turns, even after you hit the target.', 'Does ending a week early when you hit the target make it more exciting?', 'Weeks never end early.'],
  'bu-no-colours': ['No colours at all: every card is grey.', 'How much of the fun comes from colours?', 'Only numbers and merges matter.'],
  'bu-no-office': ['No office cards or bosses: just the target and the posted blame.', 'How much do the office cards add, and do you miss them?', 'Nothing sits above your stacks.'],
  'bu-see-all': ['Every office card shows what it will do.', 'Is it more fun to see everything, or does hidden information add tension?', 'No "?" cards.'],
  'bu-r17': ['The first playable version: no money, no deck, no colours, fixed 5-turn weeks.', 'How far has the game come? Is anything better in the simple version?', 'No money, no colours; packs cost nickels (n).'],
  'bu-encounters': ['Each floor brings named fights: the Night Crew, a Sales rival, then the boss. Winning a fight lets you recruit one of its cards.', 'Is the Night Crew fun to survive, and is recruiting your enemies exciting?', 'Night Crew week: there is no target; keep enough stacks alive until the last turn while cleaning crew cards break things and leave mess (each mess: −5% work). A brown top card can sweep. Sales week: hit 125% of the target in 4 turns; red stacks work ×1.5, blue ones ×½. After a won fight, pick one of two cards or skip.', 'Did the Night Crew feel like a fight you could plan for?'],
  'bu-enc-no-recruits': ['The same fights, but winning one gives no card.', 'How much does the recruit reward add to the fights?', 'No recruit offer after a fight.'],
  'bu-enc-four-inks': ['The fights, on the four-colour wheel with department actions.', 'Do the fights and the four colours work together, or is it too much at once?', 'See entries 16 and 19: fights plus four colours and their buttons.'],
  'bu-four-inks': ['Four colours on a painter\'s wheel (red, yellow, green, blue), each a department with its own action.', 'Are four colours and their actions more interesting than three?', 'Blue top card: put its stack on one office card (×2). Yellow: bank this turn\'s work and release it later at ×1.5. Green: promise a number on day 1; hit it to get paid, miss it and take blame. Red: move a card from behind one stack to another.'],
  'bu-encounters-b': ['The harder fights: the Night Crew wants more stacks each floor, its cards come back stronger, and recruits have their own actions.', 'Do harder fights with stronger recruits make the run more tense and rewarding?', 'Night Crew: keep 2, then 3, then 4 stacks. A crew card that acts returns stronger. Recruited crew (LB) can sweep; closers (CL) can double one stack\'s work once a week.'],
  'bu-enc-b-no-verbs': ['The harder fights, but recruits have no actions.', 'Are recruit actions what makes recruiting worth it?', 'Recruits cannot sweep or close.'],
  'bu-v-noeconomy': ['No hiring costs, salaries or bills.', 'Does the money make the game better or just busier?', 'Money only buys packs.'],
  'bu-v-provisionaleconomy': ['An earlier money table: work earns money, salaries are steeper.', 'Does earning money from work feel better than Friday bills?', 'Money comes in as you work.'],
  'bu-v-oldpacks': ['Older pack odds: more middle cards, fewer rare highs.', 'Are steady middle cards more fun than chasing rare high ones?'],
  'bu-v-mergeonly': ['Only merging: two of a number make one higher.', 'Is stacking in order (a card on one lower) needed?', 'A card cannot go on one exactly lower.'],
  'bu-v-orderonly': ['Only stacking in order: a card goes on one exactly lower.', 'Is merging needed?', 'Two cards of the same number cannot merge.'],
  'bu-v-freeplay': ['Any card goes on top of any lower card.', 'Do the placement rules make it a puzzle, or just get in the way?', 'Place any card on any lower top card.'],
  'bu-v-notuck': ['A 1 cannot join the back of a stack.', 'Is tucking interns behind a stack important?', 'No tuck.'],
  'bu-v-reseteachfloor': ['Your table and hand are cleared at every new floor.', 'Does keeping your team between floors matter for fun?', 'Every 3 weeks you start over.'],
  'bu-v-clearance6': ['Hidden office cards need a 6 on your table to read.', 'Is it fun to work toward seeing hidden threats?', 'Hidden cards need a 6, not a 4.'],
  'bu-v-sightnoone': ['Hidden office cards stay hidden whatever you hold.', 'Does never seeing hidden threats feel unfair or exciting?'],
  'bu-v-allclassifiedeveryone': ['Every office card is a "secret" card, but you see them all.', 'A comparison row: secret cards are nastier; is it fun when you can see them?'],
  'bu-v-allclassifiednoone': ['Every office card is hidden.', 'Is playing blind fun or frustrating?'],
  'bu-v-problemsclassified4': ['Which stack each posted blame will hit is hidden until you have a 4.', 'Is hidden blame more tense, or just confusing?', 'Blame shows "→?" until you hold a 4.'],
  'bu-v-problemsclassifiednoone': ['Which stack each posted blame will hit is never shown.', 'Can you still plan when blame lands anywhere?'],
  'bu-v-nobonus': ['No extra pay for a week of double or triple the target.', 'Does the bonus for a huge week matter to you?'],
  'bu-v-notoploss': ['Top cards (7-9) pay for themselves.', 'Are very high cards more fun when they are not a money risk?'],
  'bu-v-fourinksv': ['The first four-colour wheel, before tuning.', 'Compare with entry 19: which reads better?', 'More cards turn brown.'],
  'bu-v-fourinkseven': ['Four colours spaced evenly around the wheel.', 'Do evenly spaced colours mix more clearly?'],
  'bu-v-fourinksbrown25': ['Four colours; fewer mixes turn brown.', 'How much brown feels right?'],
  'bu-v-fourinksbrown45': ['Four colours; more mixes turn brown.', 'How much brown feels right?'],
  'bu-v-fourinksnoverbs': ['Four colours without department actions.', 'Are the colour actions worth learning?', 'No assign, bank, promise or move buttons.'],
  'bu-v-fourinkscolouredinterns': ['Four colours with coloured interns.', 'Do coloured interns help on the four-colour wheel?'],
  'bu-v-fourinksrusset': ['Four colours where red + green makes its own colour (russet) instead of brown.', 'Does an extra colour add choice or just clutter?'],
  'bu-v-encountersnostance': ['The fights without the Sales rival\'s grudge (red ×1.5, blue ×½).', 'Does the grudge make Sales week interesting?'],
  'bu-v-encountersbnobar': ['The harder fights, but the Night Crew always wants 2 stacks.', 'Is a rising survival target needed?'],
  'bu-v-encountersbnopressure': ['The harder fights, but crew cards leave after acting.', 'Do returning crew cards add good pressure or just pain?'],
  'bu-v-encountersbnocrewmerge': ['The harder fights, but a crew card merged into another is lost.', 'Does keeping crew through merges matter to you?'],
  'bu-v-seatson': ['Safety seats: blame shows as a range (2±2), and different colours on your table share the risk.', 'Is it fun to gamble on a range instead of a fixed number?', 'Blame lands somewhere in the range shown. More different colours on your table ("pool") make the range smaller; the cards behind your stacks catch blame that would hit you.'],
  'bu-v-seatsnopool': ['Safety seats without colours sharing the risk.', 'Does sharing risk across colours matter?'],
  'bu-v-seatsnobench': ['Safety seats without the back cards catching overflow.', 'Does the safety net matter?'],
  'bu-v-seatsnodeptspread': ['Safety seats where colours do not change the range.', 'Do colours changing the range add choice?'],
  'bu-v-seatsencountersb': ['Safety seats with the harder fights.', 'Do the two ideas work together?'],
  'bu-v-seatswidespread': ['Safety seats with wider swings (±60%).', 'How swingy is fun?'],
  'bu-v-seatscolouredinterns': ['Safety seats with coloured interns.', 'Do coloured interns make sharing risk easier?'],
  'bu-v-seatscolouredwide': ['Safety seats, coloured interns, the widest swings (±100%).', 'Is a very swingy game exciting or random?'],
  'bu-v-seatsanywhere': ['Safety seats where any colour anywhere on the table shares risk.', 'Is it clearer when every card counts?'],
  'bu-v-seatspalekeeps': ['Safety seats where a white top card shows its team\'s colour.', 'Does this make the table easier to read?'],
  'bu-v-seatsboth': ['Safety seats with both changes above.', 'Is this the clearest version of safety seats?'],
  'sc-chain-of-command': ['A team tree: you manage two managers who each manage two; orders take time to travel down.', 'Is planning ahead around slow orders fun?'],
  'sc-clearance': ['A team tree where problems come face down; higher clearance lets you see them days ahead.', 'Is seeing further ahead a good reward?'],
  'sc-head-office-intends': ['Head Office posts its moves two days ahead; you plan around them.', 'Is a rival that tells you its plans fun to outwit?'],
  'sc-line-of-sight': ['A column of desks: whoever sits behind a worker watches them, adding work and strain.', 'Is arranging who watches whom an interesting puzzle?'],
  'sc-off-the-books': ['You choose how much surplus to report each Friday and hide the rest.', 'Is hiding results and skimming tense and tempting?'],
  'sc-org-tree': ['The basic team tree: you manage two; managers lift their staff.', 'Is building a reporting tree fun on its own?'],
  'sc-paper-or-email': ['Each task is done on paper or by email, and office cards punish one or the other.', 'Is choosing paper or email a real decision?'],
  'sc-performance-review': ['The first office deck game: hit weekly targets while office cards cause trouble.', 'Is the basic office fight fun?'],
  'sc-personal-guarantee': ['Each Monday you pledge cards as a guarantee; meet the week and they come back stronger.', 'Is betting your own cards exciting?'],
  'sc-spot-check': ['The Hand marks desks each day; whoever sits there is taken after the punch.', 'Is dodging the marks with temps and red tape fun?'],

<script type="module">
// The playtest hub (round 21). The rules are the C# core itself, compiled to WebAssembly (net/), so every prototype
// plays exactly as the lab measured it. This page decides nothing: it sends command words and draws the engine's view.
const app = document.getElementById('app');
const KEY = 'simmili-hub-r21';
let E, menu = [], cur = null, view = null, sel = null, chips = [], msg = '', cmds = [], seed = '1';
let ratings = {}, myId = null, db = null, dbState = 'connecting';
let infoKey = null; // the help card open: an entry's key, or 'about'
const SEEN = 'simmili-hub-seen';
const seenInfo = () => { try { return JSON.parse(localStorage.getItem(SEEN) || '{}') || {}; } catch (e) { return {}; } };
const markSeen = k => { try { const x = seenInfo(); x[k] = 1; localStorage.setItem(SEEN, JSON.stringify(x)); } catch (e) {} };

const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ key: cur && cur.key, seed, cmds })); } catch (e) {} };
const newSeed = () => String(Math.floor(Math.random() * 1e9)); // picks a seed for a new run; the run itself is seeded

// ---- the engine ------------------------------------------------------------------------------------------------
async function boot() {
  try {
    const { dotnet } = await import('./net/dotnet.js');
    const rt = await dotnet.create();
    const ex = await rt.getAssemblyExports(rt.getConfig().mainAssemblyName);
    E = ex.Hub;
    menu = JSON.parse(E.Menu());
  } catch (err) {
    app.innerHTML = '<div class="boot panel">The C# engine could not start in this browser.<br><span class="dim">' + esc(err && err.message || err) + '</span></div>';
    return;
  }
  let d = window.claude?.hot?.data?.key ? window.claude.hot.data : null;
  if (!d) { try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; } }
  if (d && d.key && menu.some(m => m.key === d.key) && /^\d{1,20}$/.test(d.seed || '')) start(d.key, d.seed, d.cmds || []);
  else showMenu();
  connectDb();
}
window.claude?.hot?.snapshot?.(() => ({ key: cur && cur.key, seed, cmds }));

function apply(r) {
  view = r.view;
  r.events.forEach(e => {
    if (e.kind === 'punch' || e.kind === 'reset') chips = [];
    if (e.text) chips.push([e.kind, e.text]);
  });
}
function start(key, s, replay) {
  cur = menu.find(m => m.key === key) || menu[0];
  seed = String(s); cmds = []; chips = []; sel = null; msg = '';
  apply(JSON.parse(E.New(cur.key, seed)));
  (replay || []).forEach(w => { const r = JSON.parse(E.Do(w)); if (r.ok) { cmds.push(w); apply(r); } });
  save(); render();
}
function act(words) {
  const r = JSON.parse(E.Do(words));
  if (!r.ok) { msg = r.why; render(); return; }
  if (view && view.generic) chips = [];
  msg = ''; sel = null; cmds.push(words); apply(r); save();
  if (view.over) recordPlay();
  render();
}
function showMenu() { cur = null; view = null; save(); render(); }

// ---- ratings (shared db: Claude reads them back) ------------------------------------------------------------------
// outside Claude (a static host such as GitHub Pages) there is no db: ratings stay in this browser, and the tester sends
// them as a GitHub issue (or copies them)
const RKEY = 'simmili-hub-ratings';
const FEEDBACK_REPO = 'talonbaker/talonbaker.github.io';
function offline() {
  dbState = 'off'; db = null;
  try { ratings = JSON.parse(localStorage.getItem(RKEY) || '{}') || {}; } catch (e) { ratings = {}; }
  render();
}
function feedbackText(key) {
  const m = menu.find(x => x.key === key) || { title: key }, r = ratings[key] || {};
  return 'Entry: ' + (menu.indexOf(m) + 1) + '. ' + m.title + ' (' + key + ')\n' +
    'Fun: ' + (r.fun ? r.fun + '/5' : '-') + '\nNote: ' + (r.note || '-') + '\n' +
    'Plays: ' + (r.plays || 0) + ', best: ' + (r.best || 0) + ' weeks, wins: ' + (r.wins || 0) + '\n' +
    'Last seed: ' + (r.lastSeed || seed) + (r.lastWeeks != null ? ' (' + r.lastWeeks + ' weeks)' : '') + '\n';
}
function issueUrl(key) {
  const m = menu.find(x => x.key === key) || { title: key };
  return 'https://github.com/' + FEEDBACK_REPO + '/issues/new?title=' + encodeURIComponent('Simmili playtest: ' + m.title) + '&body=' + encodeURIComponent(feedbackText(key));
}
function allFeedback() { return menu.filter(m => ratings[m.key]).map(m => feedbackText(m.key)).join('\n'); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); msg = ''; flash = 'copied'; }
  catch (e) { flash = ''; copyBox = text; }
  render();
}
let flash = '', copyBox = '';
async function connectDb() {
  const timer = setTimeout(() => { if (dbState === 'connecting') offline(); }, 10000);
  try {
    const [d, u] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
    if (!d || !u) { clearTimeout(timer); offline(); return; }
    db = d; myId = await u.id();
    db.collection('ratings').onSnapshot(snap => {
      clearTimeout(timer);
      ratings = {};
      snap.docs.forEach(doc => { const x = doc.data(); if (x && x.user === myId) ratings[x.key] = x; });
      dbState = 'on'; render();
    }, () => { clearTimeout(timer); offline(); });
  } catch (e) { clearTimeout(timer); offline(); }
}
async function writeRating(key, patch) {
  if (!db || !myId) {
    ratings[key] = Object.assign({ key, fun: 0, note: '', plays: 0, best: 0, wins: 0 }, ratings[key] || {}, patch, { key, at: new Date().toISOString() });
    try { localStorage.setItem(RKEY, JSON.stringify(ratings)); } catch (e) {}
    render(); return;
  }
  const prev = ratings[key] || { key, user: myId, fun: 0, note: '', plays: 0, best: 0, wins: 0 };
  const next = Object.assign({}, prev, patch, { key, user: myId, title: (menu.find(m => m.key === key) || {}).title || key, at: new Date().toISOString() });
  ratings[key] = next; render();
  try { await db.doc('ratings/' + key + '--' + myId).set(next); } catch (e) { msg = 'rating not saved: ' + (e && e.code || e); render(); }
}
function recordPlay() {
  const r = ratings[cur.key] || {};
  writeRating(cur.key, { plays: (r.plays || 0) + 1, best: Math.max(r.best || 0, view.weeks), wins: (r.wins || 0) + (view.won ? 1 : 0), lastSeed: seed, lastWeeks: view.weeks });
}

// ---- colour ----------------------------------------------------------------------------------------------------------
const PRIM = ['var(--r)', 'var(--bl)', 'var(--y)', 'var(--w)'];
// the four-ink wheel's 12 sectors (red 0 ... magenta 11) and russet (12), as displayed
const WHEEL = ['var(--r)', '#e4512a', 'var(--o)', '#f2a218', 'var(--y)', '#9cc72a', 'var(--g)', '#1f9a92', 'var(--bl)', '#3b3fae', 'var(--p)', '#c2308a', '#8e3b2c'];
const SEC = { '0,1': 'var(--p)', '0,2': 'var(--o)', '1,2': 'var(--g)' };
function colour(c) {
  if (c.beige) return { bg: 'var(--beige)', light: true };
  switch (c.hue) {
    case 'Dept': return { bg: PRIM[c.a], light: c.a === 2 };
    case 'Pure': return { bg: PRIM[c.a], light: c.a === 2 };
    case 'Secondary': { const k = [Math.min(c.a, c.b), Math.max(c.a, c.b)].join(','); return { bg: SEC[k], light: k === '0,2' }; }
    case 'Tint': {
      const other = c.b === 3 ? 'var(--w)' : SEC[[Math.min(c.a, c.b), Math.max(c.a, c.b)].join(',')];
      return { bg: 'color-mix(in oklab, ' + PRIM[c.a] + ' ' + (c.b === 3 ? 55 : 62) + '%, ' + other + ')', light: c.a === 2 || c.b === 3 };
    }
    case 'Wheel': {
      if (c.brown) return { bg: c.pale ? 'color-mix(in oklab, var(--n) 60%, var(--w))' : 'var(--n)', light: c.pale };
      if (c.a < 0) return { bg: 'var(--w)', light: true };
      const base = WHEEL[c.a], light = c.pale || [3, 4, 5].includes(c.a);
      return { bg: c.pale ? 'color-mix(in oklab, ' + base + ' 55%, var(--w))' : base, light };
    }
    case 'Brown': return { bg: 'var(--n)' };
    case 'None': return c.code === 'W' ? { bg: 'var(--w)', light: true } : { bg: 'var(--grey)' };
  }
  return { bg: 'var(--grey)' };
}
function cardHtml(c, cls, tag, attrs, extra) {
  const k = colour(c);
  if (c.loadBearing) extra = (extra || '') + ' LB';
  if (c.closer) extra = (extra || '') + ' CL';
  return '<' + (tag || 'div') + ' class="card ' + (cls || '') + (k.light ? ' lightc' : '') + (c.frozen ? ' frozen' : '') + '" style="background:' + k.bg + '"' + (attrs || '') + '><span>' + c.level + (c.leader ? '★' : '') + '</span><small>' + esc(c.code) + (extra || '') + '</small></' + (tag || 'div') + '>';
}
const sw = (bg, label) => '<span><i class="sw" style="background:' + bg + '"></i>' + esc(label) + '</span>';

function render() {

}
function renderBody() {

    h += '</button><div class="foot">' + (t.cards.length ? '<b>' + t.work + '</b> ' + esc(t.effect) : (k + 1)) + (t.jam ? ' <span class="jam">jam ' + t.jam + '</span>' : '') +

    if (view.table[sel.slot].reassign[sel.ci].includes(k + 1)) out += '<button class="go" data-cmd="reassign ' + (sel.slot + 1) + ' ' + (sel.ci + 1) + ' ' + (k + 1) + '">reassign here</button>';
  } else if (sel && sel.slot != null && view.moves[sel.slot][k]) {
    out += '<button class="go" data-cmd="move ' + (sel.slot + 1) + ' ' + (k + 1) + '">' + view.moves[sel.slot][k] + ' here</button>';
  }
  return out;
}
function verbsFor(t, k) {
  let b = '';
  if (t.canClose) b += '<button data-cmd="close ' + (k + 1) + '">close x2</button>';
  if (t.canBook) b += '<button data-cmd="book ' + (k + 1) + '">book</button>';
  t.assign.forEach(o => { const c = view.office[o - 1]; b += '<button data-cmd="assign ' + (k + 1) + ' ' + o + '">on #' + o + ' ' + esc(c.face) + c.size + '</button>'; });
  if (t.sweepMess) b += '<button data-cmd="sweep mess ' + (k + 1) + '">sweep mess</button>';
  if (t.sweepSign) b += '<button data-cmd="sweep sign ' + (k + 1) + '">sign</button>';
  return b ? '<div class="acts" style="flex-wrap:wrap">' + b + '</div>' : '';
}
function ratingPanel(key, inOverlay) {
  const r = ratings[key] || {};
  let h = (inOverlay ? '<div style="margin-top:12px">' : '<div class="panel">') + '<div class="label">fun? ' + (dbState === 'on' ? '' : dbState === 'off' ? '(kept in this browser)' : '(connecting)') + '</div><div class="row rate">';
  for (let i = 1; i <= 5; i++) h += '<button data-fun="' + i + '" class="' + (r.fun >= i ? 'on' : '') + '" aria-label="fun ' + i + ' of 5">' + i + '</button>';
  h += '</div><div class="row" style="margin-top:6px"><input type="text" id="note' + (inOverlay ? '2' : '') + '" maxlength="200" placeholder="one line" value="' + esc(r.note || '') + '" style="flex:1;min-width:10ch"><button class="btn" data-note="' + (inOverlay ? 'note2' : 'note') + '">save</button></div>' +
    (dbState === 'off' ? '<div class="row" style="margin-top:6px"><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(issueUrl(key)) + '">send feedback</a><button class="btn" data-copyfb="' + esc(key) + '">copy feedback</button>' + (flash ? '<span class="dim num">' + esc(flash) + '</span>' : '') + '</div>' + copyArea() : '') + '</div>';
  return h;
}
// any other scenario: its own Status as numbers, a button per Help verb, and a text box
function verbsOf(help) {
  const out = [];
  help.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const usage = line.split(/\s{2,}/)[0], desc = line.slice(usage.length).trim();
    usage.split(/\s*[,|]\s*/).forEach(u => {
      u = u.replace(/[()]/g, '').trim();
      if (!u || !/^[a-z]/.test(u)) return;
      const words = u.split(/\s+/), fixed = [];
      for (const x of words) { if (/^[a-z][a-z-]*$/.test(x)) fixed.push(x); else break; }
      out.push({ label: u, run: fixed.length === words.length ? fixed.join(' ') : '', fill: fixed.join(' ') + ' ', desc });
    });
  });
  return out;
}
function renderGeneric() {
  const v = view;
  let h = '<div class="app"><div class="panel">';
  h += '<div class="top"><button class="btn" data-back="1">← menu</button><span class="name">' + (menu.indexOf(cur) + 1) + '. ' + esc(cur.title) + '</span><button class="ibtn" data-info="' + esc(cur.key) + '" aria-label="how to play">i</button><span class="dim num" style="font-size:12px">seed ' + esc(seed) + ' · ' + v.weeks + '/' + v.weeksToWin + '</span></div>';
  h += '<pre class="num" style="white-space:pre-wrap;font-size:13px;line-height:1.45;margin:6px 0;overflow-x:auto">' + esc(v.status) + '</pre>';
  h += '<div class="feed">' + chips.map(c => '<span class="chip ' + c[0] + '">' + esc(c[1]) + '</span>').join('') + '</div><div class="msg">' + esc(msg) + '</div>';
  h += '<div class="row" style="margin-top:6px">' + verbsOf(v.help).map(x => '<button class="btn" title="' + esc(x.desc) + '" ' + (x.run ? 'data-cmd="' + esc(x.run) + '"' : 'data-fill="' + esc(x.fill) + '"') + '>' + esc(x.label) + '</button>').join('') + '</div>';
  h += '<div class="row" style="margin-top:6px"><input type="text" id="cmd" autocomplete="off" placeholder="type a command, e.g. ' + esc((verbsOf(v.help)[0] || { label: 'help' }).label) + '" style="flex:1;min-width:12ch"><button class="btn punch" style="flex:0" data-go="1">do</button></div></div>';
  h += '<div class="side">' + ratingPanel(cur.key) + '<div class="panel"><ol class="rules">' + v.rules.map(l => '<li>' + esc(l) + '</li>').join('') + '</ol></div>';
  h += '<div class="panel row"><label class="num" for="seed" style="font-size:12px">seed</label><input type="text" id="seed" inputmode="numeric" value="' + esc(seed) + '"><button class="btn" data-new="1">restart</button><button class="btn" data-rand="1">new seed</button></div></div></div>';
  if (v.over) h += '<div class="over"><div class="panel"><div class="big">' + (v.won ? 'WON' : 'OVER') + '</div><div>' + v.weeks + '/' + v.weeksToWin + ' · seed ' + esc(seed) + '</div>' + ratingPanel(cur.key, true) +
    '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-again="1">same seed</button><button class="btn" data-rand="1">new seed</button><button class="btn" data-back="1">← menu</button></div></div></div>';
  const focus = document.activeElement && document.activeElement.id === 'cmd';
  app.innerHTML = h;
  if (focus) document.getElementById('cmd')?.focus();
}
function copyArea() { return copyBox ? '<textarea id="copybox" readonly style="width:100%;height:7em;margin-top:6px;font-family:var(--num);font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px">' + esc(copyBox) + '</textarea>' : ''; }
function renderMenu() {
  let h = '<div class="menu"><div class="row" style="justify-content:space-between"><h1>Simmili playtest</h1><button class="btn" data-info="about">About this playtest</button></div><div class="dim num" style="font-size:12px">pick one, play, rate it, come back. ✓ = played' + (dbState === 'off' ? ' · ratings kept in this browser: send them with "send feedback"' : '') + '</div>';
  if (dbState === 'off' && Object.keys(ratings).length) h += '<div class="row"><button class="btn" data-copyall="1">copy all my feedback</button><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://github.com/' + FEEDBACK_REPO + '/issues/new?title=' + encodeURIComponent('Simmili playtest: all') + '&body=' + encodeURIComponent(allFeedback().slice(0, 6000)) + '">send all as one issue</a>' + (flash ? '<span class="dim num">' + esc(flash) + '</span>' : '') + '</div>' + copyArea();
  let group = '';
  menu.forEach((m, i) => {
    if (m.group !== group) { group = m.group; h += '<h2 style="font-size:15px;margin:10px 0 0">' + esc(group) + '</h2>'; }
    const r = ratings[m.key];
    h += '<div class="erow"><button class="entry" data-open="' + esc(m.key) + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(m.title) + '</span><span class="r">' +
      (r && r.plays ? '<b>✓</b> ' + r.plays + 'x · best ' + r.best + 'wk' : '') + (r && r.fun ? '<br><span class="stars">' + '★'.repeat(r.fun) + '</span>' + '☆'.repeat(5 - r.fun) : '') + '</span><span class="l">' + esc(m.line) + '</span></button><button class="ibtn" data-info="' + esc(m.key) + '" aria-label="about entry ' + (i + 1) + '">i</button></div>';
  });
  h += '</div>';
  app.innerHTML = h;
}

// ---- input ------------------------------------------------------------------------------------------------------------
app.addEventListener('click', ev => {
  const ci = ev.target.closest('[data-ci]');
  if (ci && !(sel && sel.hand != null) && !(sel && sel.slot != null && sel.ci == null && +ci.closest('[data-slot]').dataset.slot !== sel.slot)) {
    const k = +ci.closest('[data-slot]').dataset.slot, i = +ci.dataset.ci, t = view.table[k];
    if (i < t.cards.length - 1 && t.reassign[i] && t.reassign[i].length) { sel = sel && sel.slot === k && sel.ci === i ? null : { slot: k, ci: i }; msg = ''; render(); return; }
  }
  const el = ev.target.closest('button');
  if (!el) return;
  const d = el.dataset;
  if (d.open) { flash = ''; copyBox = ''; start(d.open, newSeed(), []); if (!seenInfo()[d.open]) { infoKey = d.open; render(); } return; }
  if (d.info) { infoKey = d.info; render(); return; }
  if (d.closeinfo) { if (infoKey !== 'about') markSeen(infoKey); else markSeen('about'); infoKey = null; render(); return; }
  if (d.copyfb) { copyText(feedbackText(d.copyfb)); return; }
  if (d.copyall) { copyText(allFeedback()); return; }
  if (d.fill != null) { const c = document.getElementById('cmd'); c.value = d.fill; c.focus(); return; }
  if (d.go) { const c = document.getElementById('cmd'), t = c.value.trim().toLowerCase(); if (t) act(t); return; }
  if (d.back) { flash = ''; copyBox = ''; showMenu(); return; }
  if (d.cmd) { act(d.cmd); return; }
  if (d.fun) { writeRating(cur.key, { fun: +d.fun }); return; }
  if (d.note) { writeRating(cur.key, { note: document.getElementById(d.note).value.slice(0, 200) }); return; }
  if (d.quote) { const n = document.getElementById('quoteN').value.trim(); if (!/^\d{1,9}$/.test(n)) { msg = 'quote a number'; render(); return; } act('quote ' + n); return; }
  if (d.hand != null) { const i = +d.hand; sel = sel && sel.hand === i ? null : { hand: i }; msg = ''; render(); return; }
  if (d.slot != null) {
    const k = +d.slot;
    if (sel && sel.hand != null) {
      const s = view.hand[sel.hand].slots[k];
      if (s.play) act('play ' + (sel.hand + 1) + ' ' + (k + 1));
      else if (s.tuck) act('tuck ' + (sel.hand + 1) + ' ' + (k + 1));
      else { msg = s.why; render(); }
      return;
    }
    if (sel && sel.ci != null) { if (view.table[sel.slot].reassign[sel.ci].includes(k + 1)) act('reassign ' + (sel.slot + 1) + ' ' + (sel.ci + 1) + ' ' + (k + 1)); else { sel = null; render(); } return; }
    if (sel && sel.slot != null && sel.slot !== k) { act('move ' + (sel.slot + 1) + ' ' + (k + 1)); return; }
    sel = sel && sel.slot === k ? null : (view.table[k].cards.length ? { slot: k } : null);
    msg = ''; render(); return;
  }
  if (d.new) { const s = document.getElementById('seed').value.trim(); if (!/^\d{1,20}$/.test(s) || BigInt(s) > 18446744073709551615n) { msg = 'a seed is a whole number'; render(); return; } start(cur.key, s, []); return; }
  if (d.rand) { start(cur.key, newSeed(), []); return; }
  if (d.again) { start(cur.key, seed, []); return; }
});
document.addEventListener('keydown', e => {
  if (infoKey && e.key !== 'Escape') return;
  if (e.target.id === 'cmd' && e.key === 'Enter') { const t = e.target.value.trim().toLowerCase(); if (t) act(t); return; }
  if (!cur || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || (view && view.generic)) return;
  if ((e.key === ' ' || e.key === 'Enter') && !view.over) { e.preventDefault(); act('punch'); }
  if (e.key === 'Escape') { if (infoKey) { markSeen(infoKey); infoKey = null; } sel = null; render(); }
});
boot();
</script>
